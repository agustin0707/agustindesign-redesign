<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heros · agustín.design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        /* =======================================================
           COMPARADOR DE HEROS
           ======================================================= */
        /* Cada hero se ve en vivo dentro de un iframe escalado */
        :root { --g: clamp(12px, 1.6vw, 20px); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0B0B0B; color: #F5F5F3; font: 14px/1.5 'Geist', sans-serif; -webkit-font-smoothing: antialiased; }
        a { color: inherit; text-decoration: none; }
        header { display: flex; justify-content: space-between; align-items: end; padding: 28px var(--g) 20px; gap: 20px; flex-wrap: wrap; }
        h1 { font-weight: 500; font-size: clamp(28px, 3vw, 44px); letter-spacing: -0.05em; line-height: 1; }
        header p { color: #8E8E8B; max-width: 56ch; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--g); padding: 0 var(--g) var(--g); }
        .card { display: block; }
        .marco { position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 4px; background: #1a1a19; }
        .marco iframe { position: absolute; top: 0; left: 0; width: 1440px; height: 900px; border: 0; transform-origin: 0 0; pointer-events: none; }
        .pie { display: flex; justify-content: space-between; padding: 12px 2px; }
        .pie span { color: #8E8E8B; font-family: 'Geist Mono', monospace; font-size: 12px; }
        @media (hover: hover) { .card:hover .pie strong { text-decoration: underline; text-underline-offset: 3px; } }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <h1>Hero · 3 exploraciones</h1>
        <p>Tu retrato actual (ya recortado) con el nombre en Geist de tracking cerrado, solo en negro, grises y blanco. Abre cada uno y mueve el mouse: el nombre y la foto se mueven a distinta velocidad.</p>
    </header>
    <main class="grid">
        <a class="card" href="h1-capas.html"><div class="marco"><iframe src="h1-capas.html" title="Hero 1" loading="lazy" tabindex="-1"></iframe></div><div class="pie"><strong>1 · Capas</strong><span>ref. Alex Graham</span></div></a>
        <a class="card" href="h2-afiche.html"><div class="marco"><iframe src="h2-afiche.html" title="Hero 2" loading="lazy" tabindex="-1"></iframe></div><div class="pie"><strong>2 · Afiche</strong><span>ref. DARK</span></div></a>
        <a class="card" href="h3-columnas.html"><div class="marco"><iframe src="h3-columnas.html" title="Hero 3" loading="lazy" tabindex="-1"></iframe></div><div class="pie"><strong>3 · Columnas</strong><span>ref. Forty Seven</span></div></a>
    </main>
    <script>
        /* =======================================================
           INICIO JS · ESCALA DE PREVIEWS
           ======================================================= */
        (function () {
            const escalar = () => document.querySelectorAll('.marco').forEach(m => { m.querySelector('iframe').style.transform = `scale(${m.clientWidth / 1440})`; });
            escalar(); window.addEventListener('resize', escalar);
        })();
        /* =======================================================
           FIN JS · ESCALA DE PREVIEWS
           ======================================================= */
    </script>
</body>
</html>
