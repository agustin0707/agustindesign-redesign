<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&family=Inter:ital,wght@1,200..400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../works/works-base.css">
    <link rel="stylesheet" href="caso-base.css">
    <title>Caso 2 · Láminas · agustín.design</title>
    <style>
        /* =======================================================
           CASO 2 · LÁMINAS
           ======================================================= */
        /* Cada decisión ocupa una pantalla con la pieza en grande y se apila sobre la anterior, el mismo gesto
           de la Pila del índice. El texto es corto y la pieza manda; un contador abajo marca el avance */

        /* --- 1. PILA DE DECISIONES --- */
        .laminas { margin-top: var(--seccion); }
        .laminas > .cab { padding-bottom: clamp(40px, 4vw, 64px); }
        .lam { --q: 0; position: sticky; top: 0; height: 100svh; display: grid; grid-template-columns: repeat(12, 1fr); column-gap: var(--medianil); align-items: center; padding: 76px var(--margen) 72px; background: var(--fondo-lam, var(--tinte)); overflow: hidden; }
        .lam:nth-child(even) { --fondo-lam: color-mix(in srgb, var(--tinte) 95%, #fff); }
        .lam + .lam { border-radius: 18px 18px 0 0; box-shadow: 0 -24px 48px -12px rgba(0, 0, 0, 0.55); }
        .lam > :not(.velo) { transform: scale(calc(1 - var(--q) * 0.05)); transform-origin: 50% 0; will-change: transform; }
        .lam .velo { position: absolute; inset: 0; z-index: 5; background: #000; opacity: calc(var(--q) * 0.6); pointer-events: none; }

        /* --- 2. TEXTO DE LA LÁMINA --- */
        .lam-texto { grid-column: 1 / span 4; display: flex; flex-direction: column; gap: 22px; align-self: end; padding-bottom: 8px; }
        .lam-num { font-size: clamp(88px, 10vw, 168px); font-weight: 500; letter-spacing: -0.07em; line-height: 0.78; color: var(--texto-3); margin-left: -0.05em; }
        .lam-texto h3 { font-size: clamp(28px, 2.8vw, 46px); font-weight: 500; letter-spacing: -0.045em; line-height: 1; }
        .lam-texto p { max-width: 40ch; font-size: 15px; line-height: 1.5; }
        .lam-texto .porque { display: flex; flex-direction: column; gap: 6px; color: var(--texto-2); padding-top: 14px; border-top: 1px solid var(--linea); }

        /* --- 3. PIEZA DE LA LÁMINA --- */
        /* La pieza ocupa el resto de la pantalla y se contiene sin recortarse */
        .lam-pieza { grid-column: 6 / -1; height: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
        .lam-pieza .pz { width: 100%; max-height: 100%; }
        .lam-pieza .pz-img:not(.con-extra) img { width: 100%; max-height: calc(100svh - 180px); object-fit: contain; object-position: center; }
        .lam-pieza .pz-img.con-extra { grid-template-columns: 1.4fr 1fr; align-items: end; }
        .lam-pieza .pz-img.con-extra img { width: 100%; }
        .lam-pieza .pz-img.con-extra .extra { width: 100%; }
        .lam-pieza .pz-par img { max-height: calc(100svh - 220px); object-fit: cover; object-position: top; }

        /* --- 4. CONTADOR DE AVANCE --- */
        .contador { position: fixed; left: 50%; bottom: 18px; z-index: 40; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-radius: 999px; background: rgba(11, 11, 11, 0.72); translate: -50% 140%; opacity: 0; transition: translate 600ms var(--hover-lento), opacity 400ms var(--hover-lento); }
        .contador.on { translate: -50% 0; opacity: 1; }
        .contador .segs { display: flex; gap: 4px; }
        .contador .segs i { width: 18px; height: 2px; border-radius: 2px; background: rgba(245, 245, 243, 0.25); transition: background-color 400ms var(--hover-lento); }
        .contador .segs i.ya { background: var(--texto); }
        .contador b { font-weight: 400; color: var(--texto); min-width: 42px; }

        /* --- 5. VISTA MÓVIL --- */
        @media (max-width: 768px) {
            .lam { position: relative; height: auto; grid-template-columns: 1fr; row-gap: 28px; padding: 64px var(--margen); }
            .lam > :not(.velo) { transform: none; }
            .lam .velo { display: none; }
            .lam-texto, .lam-pieza { grid-column: 1 / -1; }
            .lam-pieza { height: auto; }
            .lam-pieza .pz-img.con-extra { grid-template-columns: 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            .lam > :not(.velo) { transform: none; }
            .lam .velo { display: none; }
        }
    </style>
</head>
<body>
    <header class="barra"><a href="#" class="logo">agustín<span>.</span>design</a><ul><li><a href="#">About</a></li><li><a href="#">Works</a></li><li><a href="#">Contact</a></li></ul><a class="der mono" href="../../works/w3-pila.html">← Índice</a></header>

    <main>
        <section class="grilla portada" data-portada></section>
        <section class="grilla resumen" data-resumen></section>
        <section class="laminas" id="decisiones">
            <div class="grilla"><div class="cab"><span class="etiqueta">Decisiones</span><h2 data-letras>Siete decisiones, una por problema</h2></div></div>
            <div class="pila-lam" data-laminas></div>
        </section>
        <section class="grilla proceso" data-proceso></section>
        <section class="grilla resultados" data-resultados></section>
        <div data-cierre></div>
    </main>
    <div class="contador etiqueta" aria-hidden="true"><span>Decisión</span><b data-cuenta>01 / 07</b><span class="segs" data-segs></span></div>

    <script src="caso-piezas.js"></script>

</body>
</html>
