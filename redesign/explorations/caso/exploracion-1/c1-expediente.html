<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&family=Inter:ital,wght@1,200..400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../works/works-base.css">
    <link rel="stylesheet" href="caso-base.css">
    <title>Caso 1 · Expediente · agustín.design</title>
    <style>
        /* =======================================================
           CASO 1 · EXPEDIENTE
           ======================================================= */
        /* Se lee como un expediente: un riel fijo con el índice de decisiones y el avance de lectura,
           y cada decisión como una entrada con su porqué y la pieza al lado. Lectura primero */

        /* --- 1. ESTRUCTURA --- */
        .expediente { padding-top: var(--seccion); align-items: start; }
        .expediente .cab { padding-bottom: clamp(40px, 4vw, 64px); }

        /* --- 2. RIEL --- */
        .riel { grid-column: 1 / span 3; position: sticky; top: 88px; display: flex; flex-direction: column; gap: 22px; }
        .riel ol { position: relative; list-style: none; padding-left: 16px; }
        /* Barra de avance: se llena según cuánto del expediente se leyó */
        .riel ol::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--linea); }
        .riel .avance { position: absolute; left: 0; top: 0; width: 1px; height: 100%; background: var(--texto); transform: scaleY(var(--avance, 0)); transform-origin: 50% 0; }
        .riel li a { display: grid; grid-template-columns: 26px 1fr; gap: 6px; padding: 7px 0; color: var(--texto-3); font-size: 14px; line-height: 1.3; transition: color 400ms var(--hover-lento); }
        .riel li a .etiqueta { color: inherit; padding-top: 1px; }
        .riel li a.actual { color: var(--texto); }
        @media (hover: hover) { .riel li a:hover { color: var(--texto); } }
        .atajos { display: flex; align-items: center; gap: 8px; }
        .atajos kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; border: 1px solid var(--linea); border-radius: 5px; font: 11px var(--mono); color: var(--texto); transition: background-color 150ms, color 150ms; }
        .atajos kbd.on { background: var(--texto); color: var(--tinte); }

        /* --- 3. ENTRADAS --- */
        .entradas { grid-column: 4 / -1; display: flex; flex-direction: column; gap: clamp(96px, 10vw, 160px); }
        .entrada { display: grid; grid-template-columns: repeat(9, 1fr); column-gap: var(--medianil); padding-top: 18px; border-top: 1px solid var(--linea); scroll-margin-top: 88px; }
        .entrada .num { grid-column: 1 / span 2; }
        .entrada h3 { grid-column: 3 / -1; font-size: clamp(30px, 3.3vw, 54px); font-weight: 500; letter-spacing: -0.045em; line-height: 0.98; }
        .entrada .texto { grid-column: 3 / span 4; margin-top: 28px; font-size: 17px; line-height: 1.5; max-width: 44ch; }
        .entrada .porque { grid-column: 7 / -1; margin-top: 28px; display: flex; flex-direction: column; gap: 8px; color: var(--texto-2); font-size: 15px; }
        /* La pieza va dentro de un wrapper que aparece: la pieza conserva sus propios hovers */
        .entrada .pz-envoltura { grid-column: 1 / -1; margin-top: clamp(32px, 3.6vw, 56px); }
        .entrada .pz-envoltura:has(.pz-movil) { grid-column: 3 / -1; }
        .entrada .pz-img:not(.con-extra) img { width: 100%; }

        /* --- 4. VISTA MÓVIL --- */
        @media (max-width: 768px) {
            .riel { grid-column: 1 / -1; top: 52px; z-index: 6; flex-direction: row; justify-content: space-between; align-items: center; margin: 0 calc(var(--margen) * -1) 24px; padding: 10px var(--margen); background: color-mix(in srgb, var(--tinte) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--linea); }
            .riel > .etiqueta, .riel .atajos { display: none; }
            .riel ol { padding: 0; flex: 1; }
            .riel ol::before, .riel .avance { top: auto; bottom: -11px; left: 0; width: 100%; height: 1px; transform: scaleX(var(--avance, 0)); transform-origin: 0 50%; }
            .riel li { display: none; }
            .riel li:has(.actual) { display: block; }
            .entradas { grid-column: 1 / -1; }
            .entrada { grid-template-columns: 1fr; }
            .entrada .num, .entrada h3, .entrada .texto, .entrada .porque, .entrada .pz-envoltura, .entrada .pz-envoltura:has(.pz-movil) { grid-column: 1 / -1; }
            .entrada h3 { margin-top: 10px; }
        }
    </style>
</head>
<body>
    <header class="barra"><a href="#" class="logo">agustín<span>.</span>design</a><ul><li><a href="#">About</a></li><li><a href="#">Works</a></li><li><a href="#">Contact</a></li></ul><a class="der mono" href="../../works/w3-pila.html">← Índice</a></header>

    <main>
        <section class="grilla portada" data-portada></section>
        <section class="grilla resumen" data-resumen></section>
        <section class="grilla expediente" id="decisiones">
            <div class="cab"><span class="etiqueta">Decisiones</span><h2 data-letras>Siete decisiones, una por problema</h2></div>
            <aside class="riel" aria-label="Índice de decisiones"><span class="etiqueta">En este caso</span><ol data-riel><span class="avance" aria-hidden="true"></span></ol><span class="atajos etiqueta"><kbd data-k="j">J</kbd><kbd data-k="k">K</kbd> para moverte</span></aside>
            <div class="entradas" data-decisiones></div>
        </section>
        <section class="grilla proceso" data-proceso></section>
        <section class="grilla resultados" data-resultados></section>
        <div data-cierre></div>
    </main>
    <script src="caso-datos.js"></script>
    <script src="caso-piezas.js"></script>
    <script src="c1-expediente.js"></script>
    <script src="caso-base.js"></script>
</body>
</html>
